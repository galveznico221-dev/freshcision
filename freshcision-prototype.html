.sheet-backdrop,.confirm-backdrop{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,26,19,.62)}

.step{flex:1;text-align:center;font-size:12px;font-weight:700}.step i{display:flex;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;align-items:center;justify-content:center;font-style:normal;background:#fff;border:2px solid var(--l);color:var(--m)}
.step.d i{background:var(--g);border-color:var(--g);color:#fff}.step.c i{background:var(--t);border-color:var(--t);color:#fff}
.ok{background:#D9F2E3;color:#0D5A36}.wt{background:#FFF1CC;color:#6B4A00}.sea{background:#D6EEF1;color:#0B4F57}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--d);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:340px;text-align:center;display:none;z-index:9}

const S={scr:'home',hist:[],view:'farmer',on:true,role:'',helper:false,helperName:'',helperRelationship:'',beneficiaryName:'',helperPermission:false,helperDraft:{name:'',relationship:'',beneficiary:'',permission:false},helperAttempted:false,helperReturn:'home',endHelperConfirm:false,acceptProvider:null,req:{crop:'',qty:0,loc:'',needs:[],when:'',name:'',phone:'',address:''},chat:[],draft:'',ask:'',saved:false,st:0,prov:[],tips:{},tr:'',shared:0,res:'',outcomeKg:'',outcomeEdit:false,photo:'',requests:[],currentRequestId:null,nextRequestId:1,providerProfile:null,providerDraft:{name:'',type:'',services:[],areas:[],capacity:'',schedule:'',conditions:'',rate:'',phone:''},providerProfileAttempted:false,providerTab:'new',providerRequestId:null,providerAction:'',providerActionRequestId:null,providerActionAttempted:false,providerActionDraft:{readyTime:'',rate:'',note:'',reason:'',question:'',conditions:'',doneKg:''},providerQueue:[],farmerReplyOpen:false,farmerReplyText:''};

<div class="card helper-info"><strong>What helpers can and cannot do</strong><div><b>Can:</b> describe the need, add a photo, submit and track a request, send reminders, and ask providers questions.</div><div style="margin-top:8px"><b>Cannot:</b> accept an offer, agree on a price, or change commercial terms. The member makes every final decision.</div></div>
<div class="form-field"><label class="row"><input id="helper-permission" type="checkbox" required${d.permission?' checked':''} aria-describedby="helper-permission-error" aria-invalid="${!!helperError('permission')}"><span>The farmer or fisherfolk member allows me to prepare, send, and track this request for them.</span></label><div class="field-error" id="helper-permission-error" aria-live="polite">${helperError('permission')}</div></div>
<div class="rw"><div class="helper-start-wrap" data-a="helperInvalidAttempt"><button id="start-helper" class="btn g" data-a="startHelper" type="button"${valid?'':' disabled'} aria-disabled="${valid?'false':'true'}" aria-describedby="helper-start-help">Start as helper</button></div><button class="btn o" data-a="cancelHelper" type="button">Cancel</button></div><div class="sm" id="helper-start-help">${valid?'Your details and permission are ready.': 'Complete all required fields and confirm permission to continue.'}</div></div>`}
function helperBanner(){return S.helper?`<div class="helper-banner" role="status"><span>Helping ${esc(S.beneficiaryName)} · ${esc(S.helperName)}</span><button class="btn" data-a="endHelper">End helper mode</button></div>`:''}
function acceptSheet(){const r=findRequest(S.acceptProvider),p=r&&r.provider;if(!S.helper||!r||!p||p.status!=='waiting'||p.stale)return '';
 return `<div class="sheet-backdrop" id="accept-backdrop"><section class="accept-sheet" role="dialog" aria-modal="true" aria-labelledby="accept-sheet-title"><div class="sheet-handle" aria-hidden="true"></div><div class="h" id="accept-sheet-title">Provider offer</div><div class="card"><div class="h">${esc(S.providerProfile?S.providerProfile.name:'Provider')}</div><div class="row"><b>Indicative rate:</b>&nbsp;${esc(p.rate)}</div><div class="row" style="margin-top:8px"><b>Ready time:</b>&nbsp;${esc(p.readyTime)}</div></div><p class="sm">Show this to ${esc(S.beneficiaryName)}. They decide.</p><div class="card"><div class="h">Beneficiary confirms</div><div class="sm" style="margin-bottom:10px">Hand the device to ${esc(S.beneficiaryName)}. Only they should choose.</div><button id="beneficiary-accept" class="btn g" style="min-height:64px;font-size:19px" data-a="beneficiaryAccept" data-v="${r.id}">I accept</button><button class="btn o" style="margin-top:8px" data-a="closeAccept">Not now</button></div></section></div>`}
function endHelperDialog(){return S.endHelperConfirm?`<div class="confirm-backdrop"><section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="end-helper-title"><div class="h" id="end-helper-title">End helper mode?</div><p class="sm">You will leave helper mode for ${esc(S.beneficiaryName)}. Their request will remain unchanged.</p><div class="rw"><button class="btn o" data-a="cancelEndHelper">Keep helping</button><button class="btn t" data-a="confirmEndHelper">End helper mode</button></div></section></div>`:''}
function home(){return `<div class="hero"><div style="display:flex;justify-content:space-between;align-items:center"><b style="letter-spacing:2px">FRESHCISION</b>${net()}</div>${viewSwitch()}<h1>From farm to sea, help reaches you in time.</h1><p>Tell us what you harvested or caught. We find providers who can help.</p><svg class="w" viewBox="0 0 390 50" preserveAspectRatio="none" aria-hidden="true"><path d="M0 25C60 0 120 50 195 25S330 0 390 25V50H0Z" fill="#EEF8F4"/></svg></div>${S.helper?helperBanner():''}
<div class="main"><div class="h" style="font-size:18px;margin:0">I am a…</div>
<button class="btn g big" data-a="role" data-v="farm">${ic('leaf')}Farmer</button>
<button class="btn t big" data-a="role" data-v="fish">${ic('fish')}Fisherfolk</button>
${S.helper?'':`<button class="btn o" data-a="helperSetup">${ic('people')}Someone is helping me</button>`}
<button class="btn t provider-entry" data-a="providerEntry">${ic('truck')}I am a provider</button>
<button class="btn o" data-a="go" data-v="guided" style="border-color:var(--t)">${ic('woff')}Offline guided mode</button>
${S.st>=2?`<button class="btn o" data-a="go" data-v="matches">${ic('truck')}View my request</button>`:''}
<div class="sm" style="text-align:center">You decide every step. Providers confirm before anything is final.</div></div>`}
function summary(){const r=S.req,rows=[['Role',roleName()]];
 if(S.helper)rows.push(['Requested by',`${S.helperName} (${S.helperRelationship})`],['On behalf of',S.beneficiaryName]);
 rows.push(['Product',r.crop],['Quantity',r.qty+' kg'],['Location',r.loc],['Needs',r.needs.join(', ')],['When',r.when]);
 return `<div class="card"><div class="h">Please check your request</div><div class="kv">${rows.map(([a,b])=>`<span>${esc(a)}</span><b>${esc(b)}</b>`).join('')}</div>${farmerContactFields()}${photoBox()}${S.saved?'<div style="margin-top:10px"><span class="chip wt">Saved on device · not sent yet</span><div class="sm" id="summary-submit-reason" style="margin-top:6px">It sends when you switch back online.</div></div>':''}<div class="rw" style="margin-top:12px"><button class="btn o" data-a="edit" style="font-size:15px">Edit</button><button class="btn g" data-a="submit" style="font-size:15px"${S.saved?' disabled aria-disabled="true" aria-describedby="summary-submit-reason"':''}>${S.saved?'Saved on device':S.on?'Confirm &amp; submit':'Save on device'}</button></div></div>`}
function chat(){if(!S.chat.length)S.chat.push({t:`Kumusta! Tell me what happened with your ${S.role==='fish'?'catch':'harvest'}. You can type or speak.`});
 return `<div class="main">${S.chat.map(m=>`<div class="bb${m.u?' u':''}">${esc(m.t)}</div>`).join('')}${S.chat.some(m=>m.u)&&!nextQ()&&S.st<2?summary():''}</div>
<div class="bar"><button class="ib t" data-a="mic" aria-label="Speak">${ic('mic')}</button><button class="ib" data-a="cam" aria-label="Add a photo" style="background:#fff;border:2px solid var(--g);color:var(--g)">${ic('cam')}</button><input id="in" aria-label="Type your message" placeholder="Type or speak in Filipino or English" value="${esc(S.draft)}"><button class="ib g" data-a="send" aria-label="Send">${ic('send')}</button></div>
<div style="padding:0 14px 10px;background:#fff"><button class="btn o sm2" data-a="go" data-v="guided">Use buttons instead</button></div>`}
function guided(){const r=S.req,T=[['Buyer','Find a buyer','buyer'],['Transport','Request transport','truck'],['Ice','Ice or storage','ice'],['Processing','Processing','gear']];
 return `<div class="main"><div class="h" style="margin:0">What do you have?</div><div class="rw" style="flex-wrap:wrap">${crops().map(c=>`<button class="btn ${r.crop===c?'g':'o'} sm2" style="width:auto" data-a="crop" data-v="${c}">${c}</button>`).join('')}</div>
<div class="h" style="margin:0">What help do you need?</div><div class="grid">${T.map(([k,l,i])=>`<button class="tile${r.needs.includes(k)?' sel':''}" data-a="need" data-v="${k}" aria-pressed="${r.needs.includes(k)}">${ic(i)}${l}</button>`).join('')}</div>
<div class="h" style="margin:0">How much?</div><div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px"><button class="ib" data-a="qty" data-v="-5" aria-label="Less" style="background:#fff;border:2px solid var(--g);color:var(--g)">${ic('minus')}</button><b style="font-size:26px">${r.qty} kg</b><button class="ib g" data-a="qty" data-v="5" aria-label="More">${ic('plus')}</button></div>
<div class="h" style="margin:0">Where are you?</div><select id="loc" aria-label="Location"><option value="">Choose location</option>${PL.map(p=>`<option${r.loc===p?' selected':''}>${p}</option>`).join('')}</select>
<div class="h" style="margin:0">When?</div><div class="rw">${[['Today','Today'],['Tomorrow','Tomorrow'],['Later this week','Later']].map(([v,l])=>`<button class="btn ${r.when===v?'g':'o'} sm2" data-a="when" data-v="${v}">${l}</button>`).join('')}</div>
${farmerContactFields()}${photoBox()}<button class="btn g" data-a="submit"${S.saved||S.st>=2?' disabled aria-disabled="true" aria-describedby="guided-submit-reason"':''}>${ic('check')}${S.saved?'Saved on device':S.st>=2?'Already submitted':S.on?'Submit request':'Save on device'}</button>
${S.saved?'<div style="text-align:center"><span class="chip wt">Saved on device · not sent yet</span><div class="disabled-reason" id="guided-submit-reason">Already saved; it will send when you reconnect.</div></div>':S.st>=2?'<div class="disabled-reason" id="guided-submit-reason">This request is already submitted. Start a new request to send another.</div>':''}
<button class="btn o sm2" data-a="go" data-v="chat">Use the assistant instead</button></div>`}
function matches(){const r=currentRequest();if(!r)return `<div class="main"><div class="card" style="text-align:center"><div class="h">No request yet</div><div class="sm" style="margin-bottom:12px">Start a request and your provider matches will show here.</div><button class="btn g" data-a="req">Start a request</button></div></div>`;
 const p=r.provider,profile=S.providerProfile,matched=providerMatches(r,profile),accepted=p.status==='confirmed'||p.status==='done',completed=p.status==='done';
 const status=p.stale?'<span class="provider-status waiting">Needs fresh confirmation</span>':`<span class="provider-status ${p.status==='waiting'?'confirmed':p.status==='declined'?'declined':p.status==='new'?'new':'confirmed'}">${p.status==='new'?'Waiting for provider':p.status==='waiting'?'Confirmed available':p.status==='confirmed'?(p.acceptedBy?`Accepted by ${esc(p.acceptedBy)}${p.acceptedWith?` with ${esc(p.acceptedWith)}'s help`:''}`:'Accepted'):p.status==='declined'?'Declined':'Completed'}</span>`;
 return `<div class="main"><div class="sm">${r.qty} kg ${esc(r.crop)} · ${esc(r.loc)}. Your municipality is shared with matching providers. Contact details remain private until you accept.</div>
${matched?`<div class="card"><div class="row"><div style="flex:1"><div class="h" style="margin:0">${esc(profile.name)}</div><div class="sm">${esc(profile.type)}</div></div>${status}</div>
${p.status==='new'?'<div class="sm" style="margin-top:10px">Waiting for the provider to respond.</div>':''}
${p.status==='waiting'&&!p.stale?`<div style="font-size:14px;margin:10px 0">${esc(p.rate)} · Ready ${esc(p.readyTime)}</div>${p.note?`<div class="sm">${esc(p.note)}</div>`:''}${S.helper?`<div class="rw" style="margin-top:10px"><div class="disabled-accept-wrap" data-a="accept" data-v="${r.id}" role="group" aria-label="Accept offer"><button class="btn g" disabled aria-disabled="true" aria-describedby="accept-reason">Accept</button></div><span class="disabled-reason" id="accept-reason">Only ${esc(S.beneficiaryName)} can accept offers.</span></div><button class="btn t" style="margin-top:8px" data-a="askAccept" data-v="${r.id}">Ask ${esc(S.beneficiaryName)} to accept</button>`:`<button class="btn g" style="margin-top:10px" data-a="accept" data-v="${r.id}">Accept</button>`}`:''}
${p.stale?'<div class="sm" style="margin-top:10px">Last synced 20 minutes ago. Previous availability and rate are not current.</div><button class="btn t" data-a="refresh" data-v="'+r.id+'">Request fresh confirmation</button>':''}
${p.status==='declined'?`<div class="sm" style="margin-top:10px">Declined: ${esc(p.declineReason)}</div><button class="btn t" data-a="findAnother" data-v="${r.id}">Find another provider</button>`:''}
${p.question?`<div class="card provider-panel" style="margin-top:12px"><div class="h">Provider question</div><div>${esc(p.question)}</div>${p.farmerReply?`<div class="sm" style="margin-top:8px">Your reply: ${esc(p.farmerReply)}</div>`:'<button class="btn o sm2" style="margin-top:8px" data-a="openFarmerReply">Reply</button>'}</div>`:''}
${p.conditions?`<div class="card provider-panel" style="margin-top:12px"><div class="h">Provider conditions</div><div>${esc(p.conditions)}</div>${p.farmerReply?'':`<button class="btn o sm2" style="margin-top:8px" data-a="openFarmerReply">Reply</button>`}</div>`:''}
${p.status==='done'?`<div class="sm" style="margin-top:8px">Completed · ${esc(p.doneKg)} kg handled</div>`:''}
${['new','waiting'].includes(p.status)?`<div class="rw" style="margin-top:10px"><button class="btn o" data-a="ask">Ask a question</button><button class="btn o" data-a="remind">Send reminder</button></div>`:''}
${p.status==='waiting'&&!p.stale?`<button class="btn o sm2" style="margin-top:8px" data-a="stale" data-v="${r.id}">Demo: age availability data</button>`:''}</div>`:'<div class="card"><div class="h">No matching provider profile yet</div><div class="sm">Your request is saved. A provider must offer a needed service and cover your municipality.</div></div>'}
<div class="card"><div class="h">Progress</div><div class="rw">${[['Submitted',1],['Matched',matched],['Confirmed',accepted],['Completed',completed||S.st===4]].map(([l,d],i)=>`<div class="step ${d?'d':(i===2&&!accepted||i===3&&!completed)&&(i===2||accepted)?'c':''}"><i>${d?ic('check'):i+1}</i>${l}</div>`).join('')}</div></div>
<button class="btn o" data-a="go" data-v="ai">${ic('spark')}Why these matches? (AI)</button><button class="btn t" data-a="go" data-v="outcome">${ic('check')}Record outcome</button></div>`}
function ai(){const r=S.req,has=r.crop,request=currentRequest(),provider=request&&request.provider,profile=S.providerProfile;
 return `<div class="main"><div class="card"><div class="h">1 · AI understood you</div>${has?`<div class="rw" style="flex-wrap:wrap;gap:8px">${[r.crop,r.qty+' kg',r.loc].map(x=>`<span class="chip ok">${esc(x)}</span>`).join('')}${r.needs.map(x=>`<span class="chip sea">${x}</span>`).join('')}<span class="chip sea">${esc(r.when)}</span></div>`:'<div class="sm">No request yet. Tell the assistant what you have.</div>'}<div class="sm" style="margin-top:10px">AI never guesses missing details. It asks, then you confirm.</div>${has?'':'<button class="btn g sm2" style="margin-top:10px" data-a="req">Ask the assistant</button>'}</div>
<div class="card"><div class="h">2 · Provider response</div>${request&&providerMatches(request,profile)?`<div style="font-weight:700;font-size:14px;margin:8px 0 4px">${esc(profile.name)}</div><div class="sm">${provider.stale?'Availability needs fresh confirmation':provider.status==='waiting'?'Confirmed available':provider.status==='confirmed'?'Accepted':provider.status==='declined'?`Declined: ${esc(provider.declineReason)}`:provider.status==='done'?'Completed':'Waiting for provider response'}</div>`:'<div class="sm">No matching provider response yet.</div>'}</div>
<div class="card"><div class="h">3 · Shared option (pilot)</div><div style="font-size:14px;line-height:1.4">3 farmers have 20 + 15 + 25 = 60 kg of tomatoes. A buyer needs 50 kg and one truck fits 60 kg.</div>
<button class="btn t sm2" style="margin-top:10px" data-a="shared">${S.shared===1?'Hide details':'Review shared option'}</button>
${S.shared===1?`<div class="sm" style="margin-top:10px">Nobody joins without agreeing. The buyer and transporter must also confirm.</div><div class="rw" style="margin-top:10px"><button class="btn g sm2" data-a="join">I agree to join</button><button class="btn o sm2" data-a="nojoin">No thanks</button></div>`:''}${S.shared===2?'<div class="chip ok" style="margin-top:10px">✓ You joined. Waiting for others.</div>':''}</div>
<div class="sm" style="text-align:center">AI suggests. Providers confirm. You decide. In this prototype the AI runs as simple rules in your browser. A real build would call a language model.</div></div>`}
function tips(){const k=S.tr||S.role||'fish',L=TIPS[k],n=L.filter((_,i)=>S.tips[k+i]).length;
 return `<div class="main"><div class="rw"><button class="btn ${k==='fish'?'g':'o'} sm2" data-a="tr" data-v="fish">Fisherfolk</button><button class="btn ${k==='farm'?'g':'o'} sm2" data-a="tr" data-v="farm">Farmer</button></div><span class="chip wt" style="align-self:flex-start">Sample reminders · expert review needed</span><div class="sm">${n} of ${L.length} done</div>
${L.map(([i,a,b],j)=>`<div class="card row" style="padding:12px 14px;gap:12px"><div class="ib ok" style="width:44px;height:44px">${ic(i)}</div><div style="flex:1"><b style="font-size:15px">${a}</b><div class="sm">${b}</div></div><button class="btn ${S.tips[k+j]?'t':'g'} sm2" style="width:auto" data-a="tip" data-v="${k+j}" aria-pressed="${!!S.tips[k+j]}">${S.tips[k+j]?'✓ Done':'Done'}</button></div>`).join('')}
<button class="btn g" data-a="req">${ic('truck')}Need ice or transport now?</button><div class="sm" style="text-align:center">General reminders only. Not food-safety advice or a freshness check.</div></div>`}
function outcome(){if(S.st===4&&!S.outcomeEdit)return `<div class="main"><div class="card" style="text-align:center"><div class="h">Outcome saved</div><div class="sm" style="margin-bottom:12px">Result: ${esc(S.res)}${S.outcomeKg!==''?` · ${esc(S.outcomeKg)} kg handled`:''}. Thank you. This helps the community learn where help is needed.</div><button class="btn o" data-a="editOutcome">Edit outcome</button><button class="btn g" data-a="newreq">Start a new request</button></div></div>`;
 return `<div class="main"><div class="h" style="margin:0">What happened?</div>${['Completed','Partly completed','Not completed'].map(v=>`<button class="btn ${S.res===v?'g':'o'}" data-a="res" data-v="${v}" aria-pressed="${S.res===v}">${v}</button>`).join('')}<div class="h" style="margin:0">Kilos sold or saved</div><input id="kg" type="number" min="0" inputmode="numeric" aria-label="Kilos sold or saved" style="height:48px;border:2px solid var(--l);border-radius:14px;padding:0 14px;font-size:16px" placeholder="0" value="${esc(S.outcomeKg)}"><button class="btn t" data-a="saveout">${ic('check')}Save outcome</button></div>`}
function providerProfileValid(){const d=S.providerDraft;return !!(d.name.trim()&&d.type&&d.services.length&&d.areas.length)}
function providerProfileError(field){if(!S.providerProfileAttempted)return '';const d=S.providerDraft;
 if(field==='name'&&!d.name.trim())return 'Enter a provider name.';
 if(field==='type'&&!d.type)return 'Choose a provider type.';
 if(field==='services'&&!d.services.length)return 'Choose at least one service.';
 if(field==='areas'&&!d.areas.length)return 'Choose at least one coverage area.';
 return ''}
function updateProviderProfileState(){if(S.scr!=='providerProfile')return;const valid=providerProfileValid(),button=$('#save-provider-profile'),help=$('#provider-profile-help');
 if(button){button.disabled=!valid;button.setAttribute('aria-disabled',String(!valid))}
 if(help)help.textContent=valid?'Required profile details are ready.':'Add a name, type, at least one service, and one coverage area.';
 if(S.providerProfileAttempted){[['name','provider-name'],['type','provider-type'],['services','provider-services'],['areas','provider-areas']].forEach(([field,id])=>{const error=$('#'+id+'-error'),input=$('#'+id);if(error)error.textContent=providerProfileError(field);if(input)input.setAttribute('aria-invalid',String(!!providerProfileError(field)))})}}
function providerProfileScreen(){const d=S.providerDraft,valid=providerProfileValid();
 return `<div class="provider-topline">Provider view</div><div class="main provider-form"><div class="h" style="margin:0">${S.providerProfile?'Edit provider profile':'Create provider profile'}</div><div class="sm">Only requests matching your services and coverage area will appear.</div>
<div class="form-field"><label class="field-label" for="provider-name">Provider name</label><input id="provider-name" required aria-describedby="provider-name-error" aria-invalid="${!!providerProfileError('name')}" value="${esc(d.name)}"><div class="field-error" id="provider-name-error">${providerProfileError('name')}</div></div>
<div class="form-field"><label class="field-label" for="provider-type">Provider type</label><select id="provider-type" required aria-describedby="provider-type-error" aria-invalid="${!!providerProfileError('type')}"><option value="">Choose provider type</option>${PROVIDER_TYPES.map(x=>`<option value="${x}"${d.type===x?' selected':''}>${x}</option>`).join('')}</select><div class="field-error" id="provider-type-error">${providerProfileError('type')}</div></div>
<div class="form-field"><div class="field-label">Services offered</div><div class="provider-chips" id="provider-services" aria-invalid="${!!providerProfileError('services')}">${PROVIDER_SERVICES.map(x=>`<button type="button" class="provider-chip" data-a="toggleProviderService" data-v="${x}" aria-pressed="${d.services.includes(x)}">${x}</button>`).join('')}</div><div class="field-error" id="provider-services-error">${providerProfileError('services')}</div></div>
<div class="form-field"><div class="field-label">Coverage area</div><div class="provider-chips" id="provider-areas" aria-invalid="${!!providerProfileError('areas')}">${PL.map(x=>`<button type="button" class="provider-chip" data-a="toggleProviderArea" data-v="${x}" aria-pressed="${d.areas.includes(x)}">${x}</button>`).join('')}</div><div class="field-error" id="provider-areas-error">${providerProfileError('areas')}</div></div>
<div class="form-field"><label class="field-label" for="provider-capacity">Capacity in kg per day (optional)</label><input id="provider-capacity" type="number" min="0" inputmode="numeric" placeholder="e.g. 200" value="${esc(d.capacity)}"></div>
<div class="form-field"><label class="field-label" for="provider-schedule">Available schedule (optional)</label><select id="provider-schedule"><option value="">Choose schedule</option>${['Mornings','Afternoons','Daily'].map(x=>`<option value="${x}"${d.schedule===x?' selected':''}>${x}</option>`).join('')}</select></div>
<div class="form-field"><label class="field-label" for="provider-conditions">Conditions (optional)</label><textarea id="provider-conditions" placeholder="For example: minimum quantity">${esc(d.conditions)}</textarea></div>
<div class="form-field"><label class="field-label" for="provider-rate">Indicative rate (optional)</label><input id="provider-rate" placeholder="[Indicative rate]" value="${esc(d.rate)}"></div>
<div class="form-field"><label class="field-label" for="provider-phone">Contact number (optional)</label><input id="provider-phone" type="tel" autocomplete="tel" value="${esc(d.phone)}"></div>
<div class="card sm">Rates are indicative. Final terms are agreed directly with the farmer or fisherfolk member.</div>
<div class="rw"><div class="helper-start-wrap" data-a="invalidProviderProfile"><button id="save-provider-profile" class="btn t" data-a="saveProviderProfile" type="button"${valid?'':' disabled'} aria-disabled="${valid?'false':'true'}" aria-describedby="provider-profile-help">Save profile</button></div><button class="btn o" data-a="cancelProviderProfile" type="button">Cancel</button></div><div class="sm" id="provider-profile-help">${valid?'Required profile details are ready.':'Add a name, type, at least one service, and one coverage area.'}</div></div>`}
function viewSwitch(){return `<div class="view-switch" role="group" aria-label="Switch app view"><button data-a="switchView" data-v="farmer" class="${S.view==='farmer'?'on':''}" aria-pressed="${S.view==='farmer'}">Farmer view</button><button data-a="switchView" data-v="provider" class="${S.view==='provider'?'on':''}" aria-pressed="${S.view==='provider'}">Provider view</button></div>`}

document.addEventListener('click',e=>{if(e.target.id==='accept-backdrop'){act('closeAccept');return}if(e.target.id==='reply-backdrop'){act('closeFarmerReply');return}const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id==='in')S.draft=e.target.value;
 if(id==='farmer-name')S.req.name=e.target.value;
 if(id==='farmer-phone')S.req.phone=e.target.value;
 if(id==='farmer-address')S.req.address=e.target.value;
 if(id==='helper-full-name'){S.helperDraft.name=e.target.value;updateHelperSetupState()}
 if(id==='beneficiary-name'){S.helperDraft.beneficiary=e.target.value;updateHelperSetupState()}
 if(id==='provider-name')S.providerDraft.name=e.target.value;
 if(id==='provider-capacity')S.providerDraft.capacity=e.target.value;
 if(id==='provider-conditions')S.providerDraft.conditions=e.target.value;
 if(id==='provider-rate')S.providerDraft.rate=e.target.value;
 if(id==='provider-phone')S.providerDraft.phone=e.target.value;
 if(id==='provider-ready-time')S.providerActionDraft.readyTime=e.target.value;
 if(id==='provider-action-rate')S.providerActionDraft.rate=e.target.value;
 if(id==='provider-action-note')S.providerActionDraft.note=e.target.value;
 if(id==='provider-question')S.providerActionDraft.question=e.target.value;
 if(id==='provider-conditions-text')S.providerActionDraft.conditions=e.target.value;
 if(id==='provider-done-kg')S.providerActionDraft.doneKg=e.target.value;
 if(id==='farmer-reply')S.farmerReplyText=e.target.value;
 if(id==='kg')S.outcomeKg=e.target.value;
 updateProviderProfileState()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.endHelperConfirm)act('cancelEndHelper');else if(S.acceptProvider!==null)act('closeAccept');else if(S.farmerReplyOpen)act('closeFarmerReply');else if(S.providerAction)act('cancelProviderAction');else if(S.scr==='helperSetup')act('cancelHelper')}
 if(e.key==='Enter'&&e.target.id==='in')act('send');
 if(e.key==='Enter'&&S.scr==='helperSetup'&&['helper-full-name','helper-relationship','beneficiary-name','helper-permission'].includes(e.target.id)){e.preventDefault();act('startHelper')}
 if(e.key==='Enter'&&S.scr==='providerProfile'&&['provider-name','provider-type','provider-capacity','provider-schedule','provider-rate','provider-phone'].includes(e.target.id)){e.preventDefault();act('saveProviderProfile')}});
document.addEventListener('change',e=>{const id=e.target.id;
 if(id==='loc')S.req.loc=e.target.value;
 if(id==='helper-relationship'){S.helperDraft.relationship=e.target.value;updateHelperSetupState()}
 if(id==='helper-permission'){S.helperDraft.permission=e.target.checked;updateHelperSetupState()}
 if(id==='provider-type')S.providerDraft.type=e.target.value;
 if(id==='provider-schedule')S.providerDraft.schedule=e.target.value;
 if(e.target.type==='number'&&id==='provider-capacity')S.providerDraft.capacity=e.target.value;
 if(e.target.id==='cam'&&e.target.files[0]){S.photo=URL.createObjectURL(e.target.files[0]);e.target.value='';toast('Photo added to your request.');R()}
 updateProviderProfileState()});
R();
