.accept-sheet .btn{min-height:56px}
.confirm-backdrop{z-index:11;align-items:center;padding:18px}
.confirm-dialog{width:100%;max-width:380px;padding:20px;background:var(--f);border-radius:22px;box-shadow:0 16px 48px rgba(0,0,0,.28)}
.step{flex:1;text-align:center;font-size:12px;font-weight:700}.step i{display:flex;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;align-items:center;justify-content:center;font-style:normal;background:#fff;border:2px solid var(--l);color:var(--m)}
.step.d i{background:var(--g);border-color:var(--g);color:#fff}.step.c i{background:var(--t);border-color:var(--t);color:#fff}
.ok{background:#D9F2E3;color:#0D5A36}.wt{background:#FFF1CC;color:#6B4A00}.sea{background:#D6EEF1;color:#0B4F57}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--d);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:340px;text-align:center;display:none;z-index:9}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={leaf:'<path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14z"/><path d="M5 19c3-5 6-8 9-10"/>',fish:'<path d="M3 12c3-5 9-6 13-3l5-3v12l-5-3c-4 3-10 2-13-3z"/><circle cx="8" cy="11" r=".8"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c3 0 4 2 4 5"/>',woff:'<path d="M2 2l20 20M5 12.5a10 10 0 0 1 4-2.4M2 8.8a15 15 0 0 1 5-3M16 11a10 10 0 0 1 3 1.5M12 19h.01"/>',wifi:'<path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19h.01"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',back:'<path d="M15 5l-7 7 7 7"/>',check:'<path d="M5 12l5 5L20 7"/>',truck:'<path d="M2 6h11v10H2zM13 9h5l4 4v3h-9"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',ice:'<path d="M12 2v20M4 7l16 10M20 7L4 17"/>',buyer:'<path d="M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',minus:'<path d="M5 12h14"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',circ:'<circle cx="12" cy="12" r="7"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',drop:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>'};
const ic=n=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const REQUEST_STATUSES=['DRAFT','CONFIRMED_BY_USER','SAVED_OFFLINE','SUBMITTED','PROVIDER_RESPONDED','ACCEPTED','DONE_BY_PROVIDER','OUTCOME_RECORDED'];
function blankRequest(role=''){return{id:null,receivedAt:0,submittedAt:0,role,crop:'',qty:0,loc:'',needs:[],when:'',name:'',phone:'',address:'',photo:'',helper:null,status:'DRAFT',history:[{status:'DRAFT',actor:'system',event:'created',at:Date.now()}],journey:{photoSkipped:false,aiViewed:false,aiReviewed:false,inboxViewed:false,providerResponded:false,responseReviewed:false,contactViewed:false,learned:false},provider:{status:'new',providerId:null,readyTime:'',rate:'',note:'',declineReason:'',question:'',conditions:'',farmerReply:'',doneKg:'',acceptedBy:'',acceptedWith:'',stale:false},outcome:'',outcomeKg:'',excludedProviderIds:[],responseTimeMs:null}}
const S={scr:'home',hist:[],view:'farmer',on:true,inputMode:'chat',helper:false,helperName:'',helperRelationship:'',beneficiaryName:'',helperPermission:false,helperDraft:{name:'',relationship:'',beneficiary:'',permission:false},helperAttempted:false,helperReturn:'home',endHelperConfirm:false,acceptProvider:null,req:blankRequest(),chat:[],draft:'',ask:'',providerProfiles:[],requests:[],currentRequestId:null,nextRequestId:1,providerProfile:null,providerDraft:{name:'',type:'',services:[],areas:[],capacity:'',schedule:'',conditions:'',rate:'',phone:''},providerProfileAttempted:false,providerTab:'new',providerRequestId:null,providerAction:'',providerActionRequestId:null,providerActionAttempted:false,providerActionDraft:{readyTime:'',rate:'',note:'',reason:'',question:'',conditions:'',doneKg:''},providerQueue:[],farmerReplyOpen:false,farmerReplyText:'',journeyOpen:false,tips:{},tr:'',shared:0,outcomeEdit:false};
const PL=['Daet','Mercedes','Labo','Paracale','Jose Panganiban','Vinzons','Talisay','Basud','San Vicente','Santa Elena','Capalonga'];
const PROVIDER_TYPES=['Buyer','Trader','Transporter','Ice supplier','Cold storage','Processor','Cooperative','Authorized institution'];
const PROVIDER_SERVICES=['Buy produce','Buy fish','Transport','Ice','Cold storage','Processing'];
const CR=[['tilapia','Tilapia'],['bangus','Bangus'],['tuna','Tuna'],['isda|fish|catch|huli','Fish'],['pineapple|pinya','Pineapple'],['kamatis|tomato','Tomato'],['saging|banana','Banana'],['palay|rice','Rice'],['gulay|vegetable','Vegetables']];
const ND=[['yelo|ice|storage|cold|lamig','Ice'],['transport|truck|sasakyan|hatid|deliver','Transport'],['buyer|bumili|bibili|bilhin|bentahan|market|ibenta|sell','Buyer'],['proces','Processing']];
const TIPS={fish:[['sun','Keep fish in the shade','Avoid direct sun and heat while waiting.'],['ice','Layer fish with ice','Keep the catch chilled and let melt water drain.'],['box','Do not overload boxes','Heavy stacking bruises and damages fish.'],['drop','Rinse with clean water','Remove dirt and blood. Keep tools and boxes clean.']],farm:[['sun','Harvest in cool hours','Keep harvested produce in the shade.'],['box','Use ventilated crates','Do not overfill or stack too high.'],['leaf','Sort out damaged produce','Separate bruised items so they do not spoil the rest.'],['drop','Keep produce dry','Cover it from rain and keep it off wet ground.']]};
// Simulated AI: reads Filipino or English text. In production, replace with a language-model API call.
function interpret(t){const r=S.req,x=t.toLowerCase();let m=x.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilo|kilos|kilogram|kilograms)\b/);
 if(m)r.qty=parseFloat(m[1].replace(',','.'));else if(S.ask==='qty'&&(m=x.match(/^\s*\d+(?:[.,]\d+)?\s*$/)))r.qty=parseFloat(m[0].replace(',','.'));
 PL.forEach(p=>{if(x.includes(p.toLowerCase()))r.loc=p});
 if(S.ask==='loc'&&!r.loc){const place=PL.find(p=>p.toLowerCase()===x.trim());if(place)r.loc=place}
 for(const[k,v]of CR){if(new RegExp(k).test(x)){r.crop=v;break}}
 ND.forEach(([k,v])=>{if(new RegExp(k).test(x)&&!r.needs.includes(v))r.needs.push(v)});
 if(/bukas|tomorrow/.test(x))r.when='Tomorrow';else if(/later this week|sa susunod na mga araw/.test(x))r.when='Later this week';else if(/hapon|afternoon/.test(x))r.when='Today, afternoon';else if(/ngayon|today|now/.test(x))r.when='Today'}
function nextQ(request=S.req){const r=request;
 if(!r.crop)return['crop','What product do you have? For example tilapia or tomatoes.'];
 if(!r.qty)return['qty','About how many kilos do you have?'];
 if(!r.loc)return['loc','Which Camarines Norte municipality are you in? Use its name, such as Daet or Labo.'];
 if(!r.needs.length)return['needs','What help do you need: buyer, transport, ice or storage, or processing?'];
 if(!r.when)return['when','When do you need it: today or tomorrow?'];return null}
function send(txt){if(S.req.status!=='DRAFT'){toast('This request is already confirmed. Start a new request after recording the outcome.');return}txt=(txt||'').trim();if(!txt)return;S.draft='';invalidateRequestReview();const before=JSON.stringify([S.req.crop,S.req.qty,S.req.loc,S.req.needs,S.req.when]);S.chat.push({u:1,t:txt});interpret(txt);
 const q=nextQ();S.ask=q?q[0]:'';const same=before===JSON.stringify([S.req.crop,S.req.qty,S.req.loc,S.req.needs,S.req.when]);
 S.chat.push({t:(same?'I did not catch that. ':'')+(q?q[1]:'Got it. Please check the summary below.')});R();const i=$('#in');i&&i.focus()}
function currentRequest(){return S.requests.find(x=>x.id===S.currentRequestId)||null}
function findRequest(id){return S.requests.find(x=>x.id===Number(id))||null}
function recordHistory(request,status,actor,event){const from=request.status,allowed={DRAFT:['CONFIRMED_BY_USER'],CONFIRMED_BY_USER:['SAVED_OFFLINE','SUBMITTED'],SAVED_OFFLINE:['SUBMITTED'],SUBMITTED:['PROVIDER_RESPONDED'],PROVIDER_RESPONDED:['ACCEPTED'],ACCEPTED:['DONE_BY_PROVIDER'],DONE_BY_PROVIDER:['OUTCOME_RECORDED'],OUTCOME_RECORDED:[]};
 if(!allowed[from]||!allowed[from].includes(status)){blocked(`Cannot move this request from ${from} to ${status}. Complete the current step first.`);return false}
 request.status=status;request.history.push({from,status,actor,event,at:Date.now()});return true}
function blocked(message){toast(message);R();return false}
function hasHistory(request,status){return request.history.some(item=>item.status===status)}
function canOpenLaterStage(request,status){return REQUEST_STATUSES.indexOf(request.status)>=REQUEST_STATUSES.indexOf(status)}
function requiredServices(req,need){if(need==='Buyer')return[req.role==='fish'?'Buy fish':'Buy produce'];if(need==='Transport')return['Transport'];if(need==='Ice')return['Ice','Cold storage'];if(need==='Processing')return['Processing'];return[]}
function providerMatches(req,profile){return !!(profile&&profile.areas.includes(req.loc)&&req.needs.some(n=>requiredServices(req,n).some(service=>profile.services.includes(service))))}
function requestTime(req){return new Date(req.receivedAt).toLocaleString()}
function requestDetailsReady(request=S.req){return !nextQ(request)}
function photoStageDone(request=S.req){return !!(request.photo||request.journey.photoSkipped)}
function invalidateRequestReview(request=S.req){request.journey.aiViewed=false;request.journey.aiReviewed=false}
function confirmRequestByUser(){const request=S.req;if(request.status!=='DRAFT')return blocked('This request is no longer a draft. Start a new request after recording the outcome.');
 if(!request.role)return blocked('Choose Farmer or Fisherfolk before describing the request.');
 const missing=nextQ(request);if(missing)return blocked(`Still missing: ${missing[1]}`);
 if(!photoStageDone(request))return blocked('Add a photo or choose “Continue without a photo” first.');
 if(!request.journey.aiReviewed)return blocked('Review the AI explanation before confirming the summary.');
 recordHistory(request,'CONFIRMED_BY_USER','farmer','summary-confirmed');toast('Request details confirmed. Choose Send or Save on device.');S.scr='summary';R();return true}
function saveRequestOffline(){const request=S.req;if(S.on)return blocked('You are online. Choose “Send request” instead.');
 if(request.status!=='CONFIRMED_BY_USER')return blocked('Review and confirm the request summary before saving it offline.');
 recordHistory(request,'SAVED_OFFLINE',S.helper?'helper':'farmer','saved-offline');toast('Saved on device · not sent yet');R();return true}
function submitRequest(){const request=S.req;if(!S.on)return blocked('You are offline. Choose “Save on device”; it will send when you reconnect.');
 if(!['CONFIRMED_BY_USER','SAVED_OFFLINE'].includes(request.status))return blocked('Confirm the request summary first. Then send it or save it on device.');
 if(request.status==='CONFIRMED_BY_USER'&&(!request.journey.aiReviewed||!photoStageDone(request)))return blocked('Complete the AI review and photo choice before sending.');

const JOURNEY_TITLES=['Choose role and helper','Describe the need','Add an optional photo','Review AI understanding and suggestions','Confirm the request summary','Send or save the request','Create provider profile','Review matching inbox','Respond to the request','Review provider responses','Decide whether to accept','Share contact with the accepting provider','Complete the service','Record the outcome','Review session learning'];
function journeyDone(step,request=S.req){switch(step){
 case 1:return !!(request.role&&(!S.helper||S.helperPermission));
 case 2:return requestDetailsReady(request);
 case 3:return photoStageDone(request);
 case 4:return request.journey.aiReviewed;
 case 5:return hasHistory(request,'CONFIRMED_BY_USER');
 case 6:return hasHistory(request,'SAVED_OFFLINE')||hasHistory(request,'SUBMITTED');
 case 7:return !!S.providerProfile&&journeyDone(6,request);
 case 8:return request.journey.inboxViewed;
 case 9:return request.journey.providerResponded;
 case 10:return request.journey.responseReviewed;
 case 11:return hasHistory(request,'ACCEPTED');
 case 12:return request.journey.contactViewed;
 case 13:return hasHistory(request,'DONE_BY_PROVIDER');
 case 14:return hasHistory(request,'OUTCOME_RECORDED');
 case 15:return request.journey.learned;
 default:return false}}
function journeyCurrent(){for(let step=1;step<=15;step++)if(!journeyDone(step))return step;return 16}
function journeyStepStatus(step){if(journeyDone(step))return 'Done';if(step===11&&(S.req.status!=='PROVIDER_RESPONDED'||S.req.provider.status!=='waiting'))return 'Locked';return step===journeyCurrent()?'Current':'Locked'}

 if(action==='confirm'&&(!payload.readyTime||!payload.rate))return blocked('Enter a ready time and indicative rate before confirming.');
